# --- RBAC: Cluster-admin for default service account (intentional misconfiguration) ---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: web-app-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
---
# --- DEPLOYMENT: Tasky web app ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiz-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wiz-web-app
  template:
    metadata:
      labels:
        app: wiz-web-app
    spec:
      containers:
      - name: web-app
        image: PLACEHOLDER_ECR_IMAGE
        imagePullPolicy: Always
        securityContext:
          privileged: true
        env:
        - name: MONGODB_URI
          value: "mongodb://admin:wizpassword123@10.50.0.100:27017/?authSource=admin"
        - name: SECRET_KEY
          value: "wiz-tasky-secret-key-2024"
        ports:
        - containerPort: 8080
---
# --- SERVICE: NodePort for ALB Ingress ---
apiVersion: v1
kind: Service
metadata:
  name: wiz-web-app-service
spec:
  type: NodePort
  selector:
    app: wiz-web-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
# --- INGRESS: ALB with WAF ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiz-web-app-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/wafv2-acl-arn: WAF_ACL_ARN_PLACEHOLDER
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wiz-web-app-service
            port:
              number: 80
