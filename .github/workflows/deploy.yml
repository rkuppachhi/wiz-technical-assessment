name: IaC-Deploy
on: [push, workflow_dispatch]

# Fixes the Node.js 20 deprecation warning you saw earlier
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. SECURITY CONTROL: IaC Scanning (Mandatory)
      - name: IaC Security Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true 

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # 2. STATE RECONCILIATION: Fixed for your specific bucket
      - name: Reconcile State
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform import aws_s3_bucket.backups wiz-rahul-kuppachhi-final-verified-99 || echo "Bucket already in state"
          terraform import aws_eks_cluster.wiz_cluster wiz-tasky-cluster || echo "EKS cluster already in state"
          terraform import aws_eks_node_group.tasky_nodes wiz-tasky-cluster:tasky-workers || echo "Node group already in state"
          terraform import aws_subnet.private_1b subnet-05c55dbc61d4a2cae || echo "Subnet 1b already in state"
          terraform import aws_subnet.private_1c subnet-0394d68f69f91ae77 || echo "Subnet 1c already in state"
          terraform import aws_route_table.private rtb-05a700b80ebe09301 || echo "Route table already in state"
          terraform import aws_route_table_association.p1 subnet-05c55dbc61d4a2cae/rtb-05a700b80ebe09301 || echo "RT assoc p1 already in state"
          terraform import aws_route_table_association.p2 subnet-0394d68f69f91ae77/rtb-05a700b80ebe09301 || echo "RT assoc p2 already in state"
          terraform import aws_instance.mongo_vm i-0348bcfe2c2c062c7 || echo "Mongo VM already in state"
          terraform import aws_ecr_repository.tasky wiz-tasky-app || echo "ECR already in state"
          
          # Security controls imports
          DETECTOR_ID=$(aws guardduty list-detectors --query 'DetectorIds[0]' --output text 2>/dev/null || echo "")
          if [ -n "$DETECTOR_ID" ] && [ "$DETECTOR_ID" != "None" ]; then
            terraform import aws_guardduty_detector.main "$DETECTOR_ID" || echo "GuardDuty already in state"
          fi
          terraform import aws_securityhub_account.main 418272768854 || echo "SecurityHub already in state"
          terraform import aws_securityhub_standards_subscription.aws_best_practices "arn:aws:securityhub:us-east-1::standards/aws-foundational-security-best-practices/v/1.0.0" || echo "SecurityHub subscription already in state"
          terraform import aws_iam_role.config_role wiz-config-role || echo "Config role already in state"
          terraform import aws_iam_role_policy_attachment.config_policy wiz-config-role/arn:aws:iam::aws:policy/service-role/AWS_ConfigRole || echo "Config policy already in state"
          terraform import aws_config_configuration_recorder.main wiz-config-recorder || echo "Config recorder already in state"
          terraform import aws_config_delivery_channel.main wiz-config-channel || echo "Config channel already in state"
          terraform import aws_config_config_rule.s3_public_read s3-bucket-public-read-prohibited || echo "Config rule already in state"
          terraform import aws_sns_topic.security_alerts arn:aws:sns:us-east-1:418272768854:wiz-security-alerts || echo "SNS topic already in state"
          
          # Import SNS subscription if it exists
          SUB_ARN=$(aws sns list-subscriptions-by-topic --topic-arn arn:aws:sns:us-east-1:418272768854:wiz-security-alerts --query "Subscriptions[?Protocol=='email' && Endpoint=='rahulkuppachhi@gmail.com'].SubscriptionArn" --output text 2>/dev/null || echo "")
          if [ -n "$SUB_ARN" ] && [ "$SUB_ARN" != "None" ] && [ "$SUB_ARN" != "Deleted" ] && [ "$SUB_ARN" != "PendingConfirmation" ]; then
            terraform import aws_sns_topic_subscription.email_alert "$SUB_ARN" || echo "SNS sub already in state"
          fi
          
          terraform import aws_cloudwatch_event_rule.critical_findings securityhub-critical-findings || echo "EventBridge rule already in state"
          terraform import aws_cloudwatch_event_target.sns_alert securityhub-critical-findings/send-to-sns || echo "EventBridge target already in state"
          
          # WAF and LB Controller imports
          terraform import aws_iam_role.lb_controller wiz-alb-controller-role || echo "LB role already in state"
          WAF_ID=$(aws wafv2 list-web-acls --scope REGIONAL --query "WebACLs[?Name=='wiz-tasky-waf'].{Id:Id,LockToken:LockToken}" --output json 2>/dev/null)
          WAF_ACL_ID=$(echo $WAF_ID | jq -r '.[0].Id // empty')
          if [ -n "$WAF_ACL_ID" ]; then
            WAF_ARN=$(aws wafv2 list-web-acls --scope REGIONAL --query "WebACLs[?Name=='wiz-tasky-waf'].ARN" --output text)
            terraform import aws_wafv2_web_acl.tasky "$WAF_ACL_ID/wiz-tasky-waf/REGIONAL" || echo "WAF already in state"
          fi

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: terraform plan

      # 3. IaC DEPLOYMENT
      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: terraform apply -auto-approve
