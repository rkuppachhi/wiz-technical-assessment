name: IaC-Deploy
on: [push, workflow_dispatch]

# Fixes the Node.js 20 deprecation warning you saw earlier
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. SECURITY CONTROL: IaC Scanning (Mandatory)
      - name: IaC Security Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true 

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # 2. STATE RECONCILIATION: Fixed for your specific bucket
      - name: Reconcile State
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform import aws_s3_bucket.backups wiz-rahul-kuppachhi-final-verified-99 || echo "Bucket already in state"
          terraform import aws_eks_cluster.wiz_cluster wiz-tasky-cluster || echo "EKS cluster already in state"
          terraform import aws_eks_node_group.tasky_nodes wiz-tasky-cluster:tasky-workers || echo "Node group already in state"
          terraform import aws_subnet.private_1b subnet-05c55dbc61d4a2cae || echo "Subnet 1b already in state"
          terraform import aws_subnet.private_1c subnet-0394d68f69f91ae77 || echo "Subnet 1c already in state"
          terraform import aws_route_table.private rtb-05a700b80ebe09301 || echo "Route table already in state"
          terraform import aws_route_table_association.p1 subnet-05c55dbc61d4a2cae/rtb-05a700b80ebe09301 || echo "RT assoc p1 already in state"
          terraform import aws_route_table_association.p2 subnet-0394d68f69f91ae77/rtb-05a700b80ebe09301 || echo "RT assoc p2 already in state"
          terraform import aws_instance.mongo_vm i-0348bcfe2c2c062c7 || echo "Mongo VM already in state"
          terraform import aws_ecr_repository.tasky wiz-tasky-app || echo "ECR already in state"
          
          # Security controls imports
          DETECTOR_ID=$(aws guardduty list-detectors --query 'DetectorIds[0]' --output text 2>/dev/null || echo "")
          if [ -n "$DETECTOR_ID" ] && [ "$DETECTOR_ID" != "None" ]; then
            terraform import aws_guardduty_detector.main "$DETECTOR_ID" || echo "GuardDuty already in state"
          fi
          terraform import aws_securityhub_account.main 418272768854 || echo "SecurityHub already in state"
          terraform import aws_iam_role.config_role wiz-config-role || echo "Config role already in state"
          terraform import aws_config_configuration_recorder.main wiz-config-recorder || echo "Config recorder already in state"

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: terraform plan

      # 3. IaC DEPLOYMENT
      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: terraform apply -auto-approve
