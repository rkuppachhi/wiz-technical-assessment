name: Wiz-End-To-End-Deployment
on: [push]

# Fixes the Node.js 20 deprecation warning you saw earlier
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. SECURITY CONTROL: IaC Scanning (Mandatory)
      - name: IaC Security Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true 

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # 2. STATE RECONCILIATION: Fixed for your specific bucket
      - name: Reconcile State
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform import aws_s3_bucket.backups wiz-rahul-kuppachhi-final-verified-99 || echo "Bucket already in state"
          terraform import aws_eks_cluster.wiz_cluster wiz-tasky-cluster || echo "EKS cluster already in state"
          terraform import aws_eks_node_group.tasky_nodes wiz-tasky-cluster:tasky-workers || echo "Node group already in state"
          terraform import aws_subnet.private_1b subnet-05c55dbc61d4a2cae || echo "Subnet 1b already in state"
          terraform import aws_subnet.private_1c subnet-0394d68f69f91ae77 || echo "Subnet 1c already in state"
          terraform import aws_route_table.private rtb-05a700b80ebe09301 || echo "Route table already in state"
          terraform import aws_route_table_association.p1 rtbassoc-0c9e501f2aa270484 || echo "RT assoc p1 already in state"
          terraform import aws_route_table_association.p2 rtbassoc-0652b20fbf38b622d || echo "RT assoc p2 already in state"

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: terraform plan

      # 3. IaC DEPLOYMENT
      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: terraform apply -auto-approve

      # 4. CONTAINER SECURITY: Build & Scan (Mandatory)
      # [Ref: Dev(Sec)Ops Section - Scanning Container Image]
      - name: Build Docker Image
        run: docker build -t wiz-web-app:latest .

      - name: Container Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'wiz-web-app:latest'
          format: 'table'
          exit-code: '0' 
          severity: 'CRITICAL,HIGH'
