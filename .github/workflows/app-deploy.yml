name: App-Build-Deploy
on:
  workflow_run:
    workflows: ["IaC-Deploy"]
    types: [completed]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPO: wiz-tasky-app
  EKS_CLUSTER: wiz-tasky-cluster

jobs:
  build-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. Login to ECR
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Build container image from Tasky Dockerfile
      - name: Build Docker Image
        run: |
          ECR_URI=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}
          docker build -t $ECR_URI:latest -t $ECR_URI:${{ github.sha }} ./tasky-main

      # 4. Security scan before pushing (Container Image Scanning)
      - name: Container Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 5. Push to ECR
      - name: Push to ECR
        run: |
          ECR_URI=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}
          docker push $ECR_URI:latest
          docker push $ECR_URI:${{ github.sha }}

      # 6. Configure kubectl
      - name: Configure kubectl
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      # 7. Install AWS Load Balancer Controller
      - name: Install AWS Load Balancer Controller
        run: |
          # Get LB Controller role ARN
          LB_ROLE_ARN=$(aws iam get-role --role-name wiz-alb-controller-role --query 'Role.Arn' --output text)
          
          # Install Helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          
          # Add EKS Helm repo
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          
          # Create service account for LB controller
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: aws-load-balancer-controller
            namespace: kube-system
            annotations:
              eks.amazonaws.com/role-arn: ${LB_ROLE_ARN}
          EOF
          
          # Install/upgrade the controller
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName=${{ env.EKS_CLUSTER }} \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set region=${{ env.AWS_REGION }} \
            --set vpcId=vpc-00482dedff0612c97 \
            --wait --timeout=120s

      # 8. Deploy to Kubernetes
      - name: Deploy to EKS
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          ECR_URI=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}
          
          # Get WAF ACL ARN
          WAF_ARN=$(aws wafv2 get-web-acl --name wiz-tasky-waf --scope REGIONAL --id $(aws wafv2 list-web-acls --scope REGIONAL --query "WebACLs[?Name=='wiz-tasky-waf'].Id" --output text) --query 'WebACL.ARN' --output text)
          
          # Create/update Kubernetes Secret for app credentials
          kubectl create secret generic tasky-secrets \
            --from-literal=mongodb-uri="${MONGODB_URI}" \
            --from-literal=secret-key="${APP_SECRET_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          # Replace placeholders
          sed -i "s|PLACEHOLDER_ECR_IMAGE|$ECR_URI:${{ github.sha }}|g" k8s-deployment.yaml
          sed -i "s|WAF_ACL_ARN_PLACEHOLDER|$WAF_ARN|g" k8s-deployment.yaml
          
          # Delete old LoadBalancer service if exists
          kubectl delete svc wiz-web-app-service --ignore-not-found=true
          
          kubectl apply -f k8s-deployment.yaml

      # 9. Verify deployment
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/wiz-web-app --timeout=120s
          kubectl get pods -l app=wiz-web-app
          kubectl get svc wiz-web-app-service
          echo "--- ALB Ingress ---"
          kubectl get ingress wiz-web-app-ingress
          echo "Waiting for ALB to provision..."
          sleep 30
          kubectl get ingress wiz-web-app-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo ""
